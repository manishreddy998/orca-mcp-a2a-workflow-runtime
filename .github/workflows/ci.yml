name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pipeline-and-gate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:.
      DBT_PROFILES_DIR: dbt
      WAREHOUSE_TARGET: duckdb
      DUCKDB_PATH: data/orca_workflow_runtime.duckdb
      REAL_DATA: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate synthetic multi-tenant partner workflow PDF corpus (450 PDFs, 1,080 pages, 3,600 step runs)
        run: python -m src.synth_corpus
      - name: Run Apache Beam evidence PDF ingestion and SHA-256 page indexing
        run: python -m src.beam_ingest
      - name: Run 20-way async workflow step extraction and citation receipt verification
        run: python -m src.extractor
      - name: Build dbt staging views and benefit schedule audits
        run: python -m src.warehouse --step staging
      - name: Run multi-tenant partner entity and workflow record resolution
        run: python -m src.entity_resolution
      - name: Build dbt durable checkpoint state chains, marts, and tests
        run: python -m src.warehouse --step marts
      - name: Run PDF receipt audit, 60 gold questions, and 50 adversarial break-it checks
        run: python -m src.evaluate
      - name: Run pytest suite (A2A Agent Card, MCP JSON-RPC, RLS isolation, and DAG)
        run: pytest -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoreboard-and-results
          path: results/*.json
